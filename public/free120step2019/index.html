  gtag('config', 'G-LDKSK4Z5DW');

  var SG = (function () {
    // pt is the account-wide App Analytics provider token. Without pt + mt=8
    // Apple ignores ct entirely, which is why the Campaigns page sat empty.
    var STORE = 'https://apps.apple.com/us/app/step-gunner/id6761317357';
    var PT = '128505861';
    var CT = 'free120_2019';

    function storeUrl() {
      return STORE + '?pt=' + PT + '&ct=' + encodeURIComponent(CT) + '&mt=8';
    }
    function track(event, params) {
      try { if (window.gtag) window.gtag('event', event, params || {}); } catch (e) {}
    }
    function referrerHost() {
      try {
        return document.referrer
          ? new URL(document.referrer).hostname.replace(/^www\./, '')
          : 'direct';
      } catch (e) { return 'unknown'; }
    }
    return { storeUrl: storeUrl, track: track, referrerHost: referrerHost, CT: CT };
  })();
</script>
